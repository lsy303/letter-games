.btn{border:0;font:inherit;border-radius:18px;padding:8px 14px;font-size:18px;background:#fff;color:#3b2a1a;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.hold{position:relative;overflow:hidden}.hold i{position:absolute;inset:0;background:#EF646155;transform-origin:right;transform:scaleX(0)}
.stars{font-size:22px;direction:ltr;white-space:nowrap}
h1{margin:4px 0 0;font-size:34px;color:#EF6461;text-align:center}
.sub{font-size:17px;color:#9a7a55;margin:0 0 8px;text-align:center}
.prompt{font-size:23px;text-align:center;margin:4px 0;min-height:34px;line-height:1.4}
/* home */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:440px;margin-top:10px}
.lt{aspect-ratio:1;border-radius:28px;color:#fff;font-size:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.13);position:relative;line-height:1.1}
.lt small{font-size:14px;opacity:.95}
.lt.lock{background:#E9DCC6!important;color:#bfa985}
.lt .bdg{position:absolute;top:6px;left:8px;font-size:14px;background:#fff;color:#3b2a1a;border-radius:10px;padding:1px 6px}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:#9a7a55;padding-top:8px}
.foot b{direction:ltr;color:#0F2A44}

#home{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#garden{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100%;background:#A6DC7E;display:flex;flex-direction:column}
#garden .ab{position:absolute}
.sky{position:relative;height:220px;background:linear-gradient(#BFE6FA,#E3F5FC);flex:none}
.sign{left:50%;top:62px;transform:translateX(-50%);background:#B9773F;border:5px solid #8A5326;color:#fff;border-radius:22px;padding:6px 26px 2px;font-size:32px;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.15);z-index:3}
.sign:after{content:"";position:absolute;left:50%;top:100%;width:12px;height:70px;margin-left:-6px;background:#8A5326;z-index:-1}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:18px 12px 10px}
.shp{display:flex;flex-direction:column;align-items:center;animation:bob 2.6s ease-in-out infinite}
.shp .sv{width:100%;max-width:92px;aspect-ratio:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.13))}
.shp .nm{font-size:14px;color:#2f5a1f;margin-top:4px;white-space:nowrap}
.shp.lock{animation:none;opacity:.85}
@keyframes bob{50%{transform:translateY(-5px)}}
.stn{grid-column:1/-1;border-radius:26px;padding:12px;text-align:center;color:#fff;background:linear-gradient(90deg,#E5484D,#F08C00,#FFC21A,#1F9D63,#2F7DE1,#7C4DDB);box-shadow:0 5px 0 rgba(0,0,0,.13);font-size:22px;position:relative}
.stn b{text-shadow:0 2px 0 rgba(0,0,0,.25)}.stn small{display:block;font-size:14px}.stn>span{position:absolute;top:8px;left:12px}
.stn .dots{display:flex;justify-content:center;gap:6px;margin-top:6px}.stn .dots i{width:22px;height:22px;border-radius:50%;border:3px solid #fff}
.stn.lock{filter:grayscale(1) opacity(.6)}
.cbox{width:140px;height:120px;border-radius:26px;border:5px dashed #fff;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:24px;padding-bottom:6px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.blob{width:110px;height:110px;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.ground{display:flex;justify-content:space-around;align-items:flex-end;padding:16px 8px 0;margin-top:auto}
.gfoot{display:flex;justify-content:center;align-items:center;gap:10px;font-size:14px;color:#2f5a1f;padding:10px 0 16px;background:#8DD06A}
.gfoot b{direction:ltr;color:#0F2A44}
/* letter */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px;margin-top:6px}
.tile{border-radius:24px;padding:10px;color:#fff;font-size:19px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12);position:relative}
.tile .ic{width:64px;height:64px;margin:0 auto 4px;background:#fff;border-radius:18px;padding:6px;font-size:44px;line-height:54px;color:#3b2a1a}
.tile .ok{position:absolute;top:6px;left:8px;font-size:18px}
.hero{width:110px;height:110px}
/* games */
#area{flex:1;width:100%;max-width:480px;position:relative;display:flex;flex-direction:column;align-items:center}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0}
.card{width:98px;height:98px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.08);touch-action:none;position:relative;z-index:2}
.card.drag{z-index:9}
.bask{width:170px;height:150px;margin-top:auto;margin-bottom:10px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.pop{animation:pp .45s}@keyframes pp{50%{transform:scale(1.25)}}
.ltrs{display:flex;gap:14px;margin:auto 0;flex-wrap:wrap;justify-content:center}
.lc{width:112px;height:132px;border-radius:28px;background:#fff;font-size:86px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.1);line-height:1}
canvas{flex:1;width:100%;touch-action:none}
.bub{position:absolute;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ffffffaa 13%,#d9f0ff 45%,#a9d8f5);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:50px;color:#2C5A82;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.bigpic{width:160px;height:160px;background:#fff;border-radius:30px;padding:12px;margin:6px auto;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.opts{display:flex;gap:12px;justify-content:center;margin-top:auto;margin-bottom:20px}
.opt{width:104px;height:104px;background:#fff;border-radius:24px;padding:10px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.opt svg{filter:brightness(0) opacity(.75)}
.opt.rv svg,.opt.pot svg{filter:none}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px;margin:auto 0}
.mc{aspect-ratio:1;border-radius:22px;perspective:600px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.mc .ba{color:#fff;font-size:56px}
.mc .fa{background:#fff;transform:rotateY(180deg);padding:10px}
.mc.m .fa{outline:5px solid #1F9D63}
.done{position:absolute;inset:0;background:rgba(255,246,228,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center}
.done.on{display:flex}
.done .big{font-size:42px;color:#1F9D63;margin:6px 0}
.conf{position:absolute;width:14px;height:14px;border-radius:3px;top:-20px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head><body>

</div>

function burst(dur,freq,q,gain,delay){const a=ac();if(!a)return;const n=a.createBufferSource(),len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);n.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=gain;
 n.connect(f);f.connect(g);g.connect(a.destination);n.start(a.currentTime+delay)}
